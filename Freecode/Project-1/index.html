 <!DOCTYPE html>
 <html lang="en">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=devicewidth, initial-scale=1.0">
 <title>Playing Cards</title>
 <link rel="stylsheet" href="style.css">
 </head>

 <body>
 <main id="playing-cards">

 <!-- Card 1 -->
 <div class="card">
 <div class="left">A ♠</div>
 <div class="middle">
 <span>♠</span>
 <span>♠</span>
 <span>♠</span>
 </div>
 <div class="right">A ♠</div>
 </div>

 <!-- Card 2 -->
 <div class="card">
 <div class="left">K ♥</div>
 <div class="middle">
 <span>♥</span>
 <span>♥</span>
 <span>♥</span>
 </div>
 <div class="right">K ♥</div>
 </div>

 <!-- Card 3 -->
 <div class="card">
 <div class="left">Q ♦</div>
 <div class="middle">
 <span>♦</span>
 <span>♦</span>
 <span>♦</span>
 </div>
 <div class="right">Q ♦</div>
 </div>

 </main>

 </body>

 </html>
